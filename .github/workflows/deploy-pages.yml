name: Deploy site to GitHub Pages

# Publishes the sito/ folder (the "Conosci la FMD" landing page + PDF deliverables
# + brand assets) as a public GitHub Pages website.

# Runs on pushes to main (after merge) or on manual dispatch.
# NOTE: GitHub Pages must be enabled once in repo Settings → Pages →
# Source: "GitHub Actions" before this workflow can deploy. The Actions
# token cannot enable Pages itself.
on:
  push:
    branches:
      - main
    paths:
      - 'sito/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site (sito/ folder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
